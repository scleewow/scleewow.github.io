  <path d="M212 290 Q234 304 254 292" stroke="#a8693f" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.7"/>
  <path d="M300 290 Q278 304 258 292" stroke="#a8693f" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.7"/>
  <path d="M236 318 L276 318 M238 338 L274 338" stroke="#a8693f" stroke-width="3.5" stroke-linecap="round" opacity="0.6"/>

  <!-- 벨트 -->
  <rect x="204" y="350" width="104" height="16" rx="4" fill="#5b3a1e"/>
  <rect x="244" y="348" width="24" height="20" rx="4" fill="#f5b83d" stroke="#a16207" stroke-width="2"/>

  <!-- 목·머리 -->
  <rect x="242" y="226" width="28" height="30" rx="8" fill="#c47f50"/>
  <circle cx="256" cy="200" r="36" fill="url(#skin)"/>
  <!-- 머리카락 -->
  <path d="M222 192 Q224 160 256 160 Q290 160 290 192 Q276 176 256 178 Q236 176 222 192 Z" fill="#3b2a1d"/>
