  <path d="M251 222 L251 232 M261 222 L261 232" stroke="#2b2118" stroke-width="2"/>
  <!-- 땀 -->
  <path d="M214 176 q-8 12 0 16 q8 -4 0 -16 Z" fill="#60a5fa"/>
  <path d="M304 214 q-7 10 0 14 q7 -4 0 -14 Z" fill="#60a5fa"/>

