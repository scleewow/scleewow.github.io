  <path d="M316 268 L366 206 L362 132" stroke="url(#skin)" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- 알통 -->
  <ellipse cx="166" cy="224" rx="23" ry="19" fill="#d8946a" transform="rotate(-50 166 224)"/>
  <ellipse cx="346" cy="224" rx="23" ry="19" fill="#d8946a" transform="rotate(50 346 224)"/>

  <!-- 몸통 -->
  <path d="M184 258 Q256 236 328 258 L304 360 Q256 370 208 360 Z" fill="url(#skin)"/>
