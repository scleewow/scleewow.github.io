  <path d="M394 86 Q404 74 420 74" stroke="#d6d3d1" stroke-width="5" fill="none" stroke-linecap="round" opacity="0.7"/>
  <text x="90" y="144" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="72" fill="#fff" stroke="#1c1917" stroke-width="3">1</text>
  <text x="424" y="140" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="72" fill="#fff" stroke="#1c1917" stroke-width="3">3</text>

  <!-- 무게 효과선 -->
  <path d="M60 196 L76 184 M48 222 L72 210" stroke="#8b5e34" stroke-width="5" stroke-linecap="round" opacity="0.55"/>
  <path d="M452 196 L436 184 M464 222 L440 210" stroke="#8b5e34" stroke-width="5" stroke-linecap="round" opacity="0.55"/>

  <!-- 받침대 색 큐브 -->
  <rect x="96" y="420" width="34" height="34" rx="7" fill="#dc2626" stroke="#7f1d1d" stroke-width="3"/>
  <rect x="134" y="428" width="26" height="26" rx="6" fill="#16a34a" stroke="#14532d" stroke-width="3"/>
  <rect x="384" y="424" width="30" height="30" rx="7" fill="#2563eb" stroke="#1e3a8a" stroke-width="3"/>
