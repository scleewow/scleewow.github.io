<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="70%">
      <stop offset="0" stop-color="#fff6e3"/>
      <stop offset="1" stop-color="#e6d2ad"/>
    </radialGradient>
    <radialGradient id="rock" cx="38%" cy="32%" r="75%">
      <stop offset="0" stop-color="#a8a29e"/>
      <stop offset="0.55" stop-color="#78716c"/>
      <stop offset="1" stop-color="#44403c"/>
    </radialGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e0a074"/>
      <stop offset="1" stop-color="#c47f50"/>
    </linearGradient>
  </defs>

  <!-- 배경 -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="10" y="10" width="492" height="492" rx="104" fill="none" stroke="#c9ad80" stroke-width="6"/>

  <!-- 바닥 그림자 -->
  <ellipse cx="256" cy="462" rx="120" ry="16" fill="#8b5e34" opacity="0.22"/>

  <!-- 다리 -->
  <path d="M236 392 L214 448" stroke="url(#skin)" stroke-width="34" stroke-linecap="round"/>
  <path d="M276 392 L298 448" stroke="url(#skin)" stroke-width="34" stroke-linecap="round"/>
  <ellipse cx="206" cy="456" rx="26" ry="11" fill="#5b3a1e"/>
  <ellipse cx="306" cy="456" rx="26" ry="11" fill="#5b3a1e"/>

