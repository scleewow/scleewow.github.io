  <rect x="62" y="112" width="388" height="14" rx="7" fill="#3f3a36"/>
  <!-- 손 -->
  <circle cx="150" cy="122" r="18" fill="#d8946a"/>
  <circle cx="362" cy="122" r="18" fill="#d8946a"/>

  <!-- 바위 (1 · 3) -->
  <path d="M40 120 Q34 74 76 62 Q112 50 136 78 Q156 104 140 146 Q124 182 82 178 Q44 174 40 120 Z" fill="url(#rock)" stroke="#292524" stroke-width="5"/>
  <path d="M372 112 Q372 66 414 60 Q458 56 472 98 Q484 146 452 172 Q420 190 390 168 Q370 150 372 112 Z" fill="url(#rock)" stroke="#292524" stroke-width="5"/>
