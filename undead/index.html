<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>언데드 마피아 (Undead Mafia)</title>
    <!-- Firebase 8.x SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <!-- QR Code Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1rem;
            transition: background-color 0.5s ease;
        }

        body.night-mode {
            background-color: #05050a;
            color: #e2e8f0;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background-color: #1e293b;
            border-radius: 16px;
            padding: 1.5rem;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            border: 1px solid #334155;
            transition: background-color 0.5s ease, border-color 0.5s ease;
        }

        body.night-mode .container {
            background-color: #0f121d;
            border-color: #2e1065;
            box-shadow: 0 10px 25px rgba(88, 28, 135, 0.2);
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.25rem;
            padding-bottom: 0.75rem;
            border-bottom: 1px solid #334155;
        }

        h1 { font-size: 1.3rem; color: #f43f5e; transition: color 0.5s; }
        body.night-mode h1 { color: #a855f7; }

        .lobby-btn {
            color: #94a3b8;
            text-decoration: none;
            border: 1px solid #475569;
            padding: 0.35rem 0.7rem;
            border-radius: 6px;
            font-size: 0.85rem;
        }

        .card {
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 10px;
            padding: 1rem;
            margin-bottom: 1rem;
            text-align: center;
            transition: background-color 0.5s, border-color 0.5s;
        }

        body.night-mode .card {
            background: #07090e;
            border-color: #3b0764;
        }

        input, button {
            width: 100%;
            padding: 0.8rem;
            margin-top: 0.5rem;
            border-radius: 8px;
            border: 1px solid #475569;
            background: #0f172a;
            color: white;
            font-size: 1rem;
        }

        button {
            background: #e11d48;
            font-weight: bold;
            border: none;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover { background: #be123c; }
        body.night-mode button { background: #7c3aed; }
        body.night-mode button:hover { background: #6d28d9; }

        button.secondary { background: #475569; }
        button.secondary:hover { background: #334155; }
        button.kick-btn {
            width: auto;
            padding: 0.25rem 0.5rem;
            font-size: 0.75rem;
            background: #dc2626;
            margin: 0;
        }

        #qrcode {
            display: flex;
            justify-content: center;
            margin: 0.75rem 0;
            padding: 0.5rem;
            background: white;
            border-radius: 8px;
        }

        .hidden { display: none !important; }

        .player-list {
            display: grid;
            gap: 0.5rem;
            margin-top: 0.5rem;
            text-align: left;
        }

        .player-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #1e293b;
            padding: 0.65rem 0.8rem;
            border-radius: 6px;
            border: 1px solid #334155;
        }

        body.night-mode .player-item {
            background: #131722;
            border-color: #2e1065;
        }

        .role-badge {
            font-size: 1.2rem;
            font-weight: bold;
            color: #38bdf8;
            margin: 0.5rem 0;
        }

        .log-box {
            background: #070a12;
            padding: 0.75rem;
            border-radius: 8px;
            height: 110px;
            overflow-y: auto;
            font-size: 0.85rem;
            color: #94a3b8;
            text-align: left;
            margin-bottom: 1rem;
            border: 1px solid #1e293b;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1 id="game-title">🧟 언데드 마피아</h1>
            <a href="../" class="lobby-btn">🏠 로비로</a>
        </header>

        <!-- 1. 로그인 & 방 선택 화면 -->
        <div id="screen-main">
            <div class="card">
                <h3>플레이어 설정</h3>
                <input type="text" id="nickname-input" placeholder="닉네임을 입력하세요">
                <input type="password" id="create-key-input" placeholder="방 생성 인증키 입력">
                <button onclick="createRoom()">새 방 만들기 (방장)</button>
            </div>
            
            <div class="card">
                <h3>기존 방 참가</h3>
                <input type="text" id="room-code-input" placeholder="방 코드 입력 (예: AB12)">
                <button class="secondary" onclick="joinRoom()">입장하기</button>
            </div>
        </div>

        <!-- 2. 대기실 화면 -->
        <div id="screen-lobby" class="hidden">
            <div class="card">
                <h3>방 코드: <span id="room-code-display" style="color:#f43f5e;"></span></h3>
                <div id="qrcode"></div>
                <p style="font-size:0.75rem; color:#94a3b8;">QR 코드를 스캔하여 접속 가능합니다.</p>
            </div>

            <div class="card">
                <h4>현재 접속자 (<span id="player-count">0</span>명)</h4>
                <div id="lobby-player-list" class="player-list"></div>
            </div>

            <button id="host-start-btn" class="hidden" onclick="startGame()">역할 배분 및 게임 시작</button>
        </div>

        <!-- 3. 메인 게임 진행 화면 -->
        <div id="screen-game" class="hidden">
            <div class="card">
                <p style="font-size:0.8rem; color:#94a3b8;">나의 역할</p>
                <div id="role-display-box" class="hidden">
                    <div id="my-role-title" class="role-badge"></div>
                    <p id="my-role-desc" style="font-size:0.85rem; color:#cbd5e1;"></p>
                </div>
                <button id="role-toggle-btn" class="secondary" onclick="toggleRoleSecret()">👁️ 역할 확인 (클릭)</button>
            </div>

            <div class="card">
                <h3 id="phase-title">☀ 낮 페이즈</h3>
                <p id="phase-desc" style="font-size:0.85rem; color:#94a3b8; margin-top:0.25rem;"></p>
            </div>

            <div class="log-box" id="game-log"></div>

            <div class="card">
                <h4 style="text-align:left; margin-bottom:0.5rem;">플레이어 목록</h4>
                <div id="game-player-list" class="player-list"></div>
            </div>

            <button id="phase-toggle-btn" class="hidden" onclick="nextPhase()">낮 / 밤 페이즈 전환 (방장 전용)</button>
        </div>
    </div>

    <script>
        // ===== Firebase 설정 =====
        const firebaseConfig = {
            apiKey: "AIzaSyBrvXAVaA46-qVmNek_MnUlRRLRmeYpvu8",
            authDomain: "myavalon-d1c3a.firebaseapp.com",
            databaseURL: "https://myavalon-d1c3a-default-rtdb.firebaseio.com",
            projectId: "myavalon-d1c3a",
            storageBucket: "myavalon-d1c3a.firebasestorage.app",
            messagingSenderId: "974314177774",
            appId: "1:974314177774:web:625f22956117cdc9f29fff",
            measurementId: "G-3503TJXX0W"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.database();

        // SHA-256 해시 함수
        async function hashPassword(message) {
            const msgBuffer = new TextEncoder().encode(message);
            const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }

        const ROLES = [
            { id: 'GODFATHER', name: '대부 (마피아)', team: 'mafia', desc: '밤마다 1명을 처단합니다.' },
            { id: 'DRUG_DEALER', name: '마약상 (마피아)', team: 'mafia', desc: '밤마다 1명에게 환각을 부여합니다.' },
            { id: 'INVESTIGATOR', name: '수사관 (시민)', team: 'human', desc: '밤마다 1명을 조사하여 마피아 여부를 확인합니다.' },
            { id: 'BREWER', name: '양조사 (시민)', team: 'human', desc: '밤마다 1명에게 환각을 부여하여 마약상과 상쇄합니다.' },
            { id: 'CITIZEN', name: '시민 (시민)', team: 'human', desc: '특수 능력이 없습니다. 추리로 마피아를 찾으세요.' }
        ];

        let roomCode = '';
        let myPlayerId = '';
        let myNickname = '';
        let isHost = false;
        let roomRef = null;

        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            const code = urlParams.get('room');
            if (code) {
                document.getElementById('room-code-input').value = code.toUpperCase();
            }

            myPlayerId = sessionStorage.getItem('undead_playerId') || 'p_' + Math.random().toString(36).substring(2, 9);
            sessionStorage.setItem('undead_playerId', myPlayerId);
        };

        // 방 생성 및 인증키 검증
        async function createRoom() {
            myNickname = document.getElementById('nickname-input').value.trim();
            const inputKey = document.getElementById('create-key-input').value.trim();

            if (!myNickname) return alert('닉네임을 입력하세요.');
            if (!inputKey) return alert('방 생성 인증키를 입력하세요.');

            const inputHash = await hashPassword(inputKey);

            db.ref('admin_config/create_key_hash').once('value', snapshot => {
                const storedHash = snapshot.val();

                if (!storedHash) {
                    return alert('Firebase에 인증키 설정이 존재하지 않습니다.');
                }

                if (inputHash !== storedHash) {
                    return alert('올바르지 않은 방 생성 키입니다.');
                }

                roomCode = Math.random().toString(36).substring(2, 6).toUpperCase();
                isHost = true;
                roomRef = db.ref('undead_rooms/' + roomCode);

                roomRef.set({
                    hostId: myPlayerId,
                    state: 'LOBBY',
                    dayCount: 1,
                    logs: [`방이 생성되었습니다. (방 코드: ${roomCode})`]
                }).then(() => {
                    joinRoomData();
                });
            });
        }

        function joinRoom() {
            myNickname = document.getElementById('nickname-input').value.trim();
            roomCode = document.getElementById('room-code-input').value.trim().toUpperCase();

            if (!myNickname || !roomCode) return alert('닉네임과 방 코드를 입력해 주세요.');

            roomRef = db.ref('undead_rooms/' + roomCode);

            roomRef.once('value', snapshot => {
                if (!snapshot.exists()) {
                    return alert('존재하지 않는 방입니다.');
                }
                joinRoomData();
            });
        }

        function joinRoomData() {
            const playerRef = roomRef.child('players/' + myPlayerId);
            
            playerRef.set({
                name: myNickname,
                isHost: isHost,
                isDead: false
            });

            playerRef.onDisconnect().remove();

            document.getElementById('screen-main').classList.add('hidden');
            document.getElementById('screen-lobby').classList.remove('hidden');
            document.getElementById('room-code-display').innerText = roomCode;

            const joinUrl = `${window.location.origin}${window.location.pathname}?room=${roomCode}`;
            document.getElementById('qrcode').innerHTML = '';
            new QRCode(document.getElementById('qrcode'), { text: joinUrl, width: 120, height: 120 });

            listenRoom();
        }

        function listenRoom() {
            roomRef.on('value', snapshot => {
                const data = snapshot.val();
                if (!data) {
                    alert('방이 삭제되었거나 쫓겨났습니다.');
                    location.href = './index.html';
                    return;
                }

                if (!data.players || !data.players[myPlayerId]) {
                    alert('방장에 의해 강퇴당했거나 접속이 해제되었습니다.');
                    location.href = './index.html';
                    return;
                }

                isHost = (data.hostId === myPlayerId);

                if (data.state === 'LOBBY') {
                    renderLobby(data);
                } else {
                    document.getElementById('screen-lobby').classList.add('hidden');
                    document.getElementById('screen-game').classList.remove('hidden');
                    renderGame(data);
                }
            });
        }

        function renderLobby(data) {
            const players = data.players || {};
            const playerKeys = Object.keys(players);

            document.getElementById('player-count').innerText = playerKeys.length;
            const listEl = document.getElementById('lobby-player-list');
            listEl.innerHTML = '';

            playerKeys.forEach(pId => {
                const p = players[pId];
                const item = document.createElement('div');
                item.className = 'player-item';

                let kickBtnHtml = '';
                if (isHost && pId !== myPlayerId) {
                    kickBtnHtml = `<button class="kick-btn" onclick="kickPlayer('${pId}')">강퇴</button>`;
                }

                item.innerHTML = `
                    <span>${p.name} ${p.isHost ? '👑' : ''}</span>
                    <div>${kickBtnHtml}</div>
                `;
                listEl.appendChild(item);
            });

            if (isHost) {
                document.getElementById('host-start-btn').classList.remove('hidden');
            } else {
                document.getElementById('host-start-btn').classList.add('hidden');
            }
        }

        function kickPlayer(targetId) {
            if (confirm('해당 플레이어를 강퇴하시겠습니까?')) {
                roomRef.child('players/' + targetId).remove();
            }
        }

        function startGame() {
            roomRef.child('players').once('value', snapshot => {
                const players = snapshot.val();
                const keys = Object.keys(players);

                if (keys.length < 4) {
                    return alert('최소 4명 이상의 플레이어가 필요합니다.');
                }

                let pool = [...ROLES];
                while (pool.length < keys.length) pool.push(ROLES[4]);
                pool.sort(() => Math.random() - 0.5);

                let updates = {};
                keys.forEach((pId, idx) => {
                    updates[`players/${pId}/role`] = pool[idx];
                });

                updates['state'] = 'DAY';
                updates['dayCount'] = 1;
                updates['logs'] = ['☀️ 제 1일 낮이 밝았습니다. 토론을 시작하세요.'];

                roomRef.update(updates);
            });
        }

        function renderGame(data) {
            const me = data.players[myPlayerId];
            if (me && me.role) {
                document.getElementById('my-role-title').innerText = me.role.name;
                document.getElementById('my-role-desc').innerText = me.role.desc;
            }

            if (data.state === 'NIGHT') {
                document.body.classList.add('night-mode');
                document.getElementById('game-title').innerText = '🧟 언데드 마피아 (밤)';
                document.getElementById('phase-title').innerText = `🌙 제 ${data.dayCount}일 밤`;
                document.getElementById('phase-desc').innerText = '언데드 및 특수 직업군이 능력을 행사합니다.';
            } else {
                document.body.classList.remove('night-mode');
                document.getElementById('game-title').innerText = '🧟 언데드 마피아';
                document.getElementById('phase-title').innerText = `☀️️ 제 ${data.dayCount}일 낮`;
                document.getElementById('phase-desc').innerText = '사망자(언데드)를 포함한 토론과 처형 투표를 진행합니다.';
            }

            const logBox = document.getElementById('game-log');
            logBox.innerHTML = (data.logs || []).map(l => `<div>${l}</div>`).join('');
            logBox.scrollTop = logBox.scrollHeight;

            const listEl = document.getElementById('game-player-list');
            listEl.innerHTML = '';
            Object.keys(data.players).forEach(pId => {
                const p = data.players[pId];
                const item = document.createElement('div');
                item.className = 'player-item';

                let actionBtn = '';
                if (data.state === 'DAY') {
                    actionBtn = `<button style="width:auto; padding:0.3rem 0.6rem; font-size:0.8rem;" onclick="votePlayer('${p.name}')">지목</button>`;
                } else {
                    actionBtn = `<button style="width:auto; padding:0.3rem 0.6rem; font-size:0.8rem; background:#7c3aed;" onclick="useAbility('${p.name}')">능력 사용</button>`;
                }

                item.innerHTML = `<span>${p.name} ${p.isDead ? '(사망/언데드)' : ''}</span>${actionBtn}`;
                listEl.appendChild(item);
            });

            if (isHost) {
                document.getElementById('phase-toggle-btn').classList.remove('hidden');
            } else {
                document.getElementById('phase-toggle-btn').classList.add('hidden');
            }
        }

        function toggleRoleSecret() {
            const box = document.getElementById('role-display-box');
            const btn = document.getElementById('role-toggle-btn');

            if (box.classList.contains('hidden')) {
                box.classList.remove('hidden');
                btn.innerText = '🔒 역할 숨기기';
            } else {
                box.classList.add('hidden');
                btn.innerText = '👁️ 역할 확인 (클릭)';
            }
        }

        function nextPhase() {
            roomRef.once('value', snapshot => {
                const data = snapshot.val();
                let nextState = data.state === 'DAY' ? 'NIGHT' : 'DAY';
                let nextDay = data.dayCount + (nextState === 'DAY' ? 1 : 0);
                
                let logs = data.logs || [];
                if (nextState === 'NIGHT') {
                    logs.push(`🌙 제 ${data.dayCount}일 밤이 되었습니다.`);
                } else {
                    logs.push(`☀️ 제 ${nextDay}일 밝았습니다.`);
                }

                roomRef.update({
                    state: nextState,
                    dayCount: nextDay,
                    logs: logs
                });
            });
        }

        function votePlayer(targetName) {
            if (confirm(`${targetName}님을 처형 지목하시겠습니까?`)) {
                roomRef.child('logs').once('value', s => {
                    let logs = s.val() || [];
                    logs.push(`⚖️ [지목] ${myNickname}님이 ${targetName}님을 지목했습니다.`);
                    roomRef.child('logs').set(logs);
                });
            }
        }

        function useAbility(targetName) {
            alert(`${targetName}님에게 비밀 능력을 선택했습니다.`);
        }
    </script>
</body>
</html>
