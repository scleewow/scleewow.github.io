<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>아발론 보드게임 포털</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: sans-serif; background-color: #121212; color: #fff; }
    
    header {
      padding: 1rem;
      text-align: center;
      background-color: #1e1e1e;
      border-bottom: 1px solid #333;
    }
    
    .game-container {
      width: 100%;
      height: calc(100vh - 60px);
      display: flex;
      justify-content: center;
      align-items: center;
    }
    
    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>

  <header>
    <h1>레지스탕스 아발론 Online</h1>
  </header>

  <main class="game-container">
    <!-- avalon.html을 iframe으로 불러옵니다 -->
    <iframe src="avalon.html" title="Avalon Game"></iframe>
  </main>

</body>
</html>
