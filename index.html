<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0d12" />
  <title>게임 라운지</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23e6b65c'/%3E%3Ctext x='16' y='22' font-size='16' text-anchor='middle'%3E%F0%9F%8E%B2%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0b0d12;
      --panel: #151922;
      --panel-2: #1c2230;
      --line: #2a3142;
      --text: #eef1f6;
      --muted: #8d96a8;
      --gold: #e6b65c;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      font-family: 'Noto Sans KR', system-ui, sans-serif;
      color: var(--text);
      background:
        radial-gradient(ellipse at top, rgba(230, 182, 92, 0.10), transparent 60%),
        var(--bg);
      min-height: 100vh;
      -webkit-tap-highlight-color: transparent;
    }
    .wrap {
      max-width: 880px;
      margin: 0 auto;
      padding: 40px 16px calc(40px + env(safe-area-inset-bottom));
    }
    header { text-align: center; margin-bottom: 32px; }
    header .kicker {
      color: var(--gold);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.3em;
    }
    header h1 {
      margin: 6px 0 8px;
      font-size: 34px;
      font-weight: 900;
      letter-spacing: -0.02em;
    }
    header p { margin: 0; color: var(--muted); font-size: 14px; }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 14px;
    }
    .card {
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 18px;
      border-radius: 16px;
      background: var(--panel);
      border: 1px solid var(--line);
      color: inherit;
      text-decoration: none;
      overflow: hidden;
      transition: transform 0.15s, border-color 0.15s;
    }
    .card::before {
      content: '';
      position: absolute;
      inset: 0 0 auto 0;
      height: 4px;
      background: var(--accent);
    }
    .card:hover, .card:focus-visible { transform: translateY(-2px); border-color: var(--accent); outline: none; }
    .card:active { transform: translateY(0); }
    .card-top { display: flex; align-items: center; gap: 12px; }
    .icon {
      width: 48px;
      height: 48px;
      flex: 0 0 auto;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      background: color-mix(in srgb, var(--accent) 18%, var(--panel-2));
    }
    .card h2 { margin: 0; font-size: 19px; font-weight: 700; }
    .card .sub { font-size: 12px; color: var(--muted); }
    .card .desc { margin: 0; font-size: 14px; line-height: 1.55; color: #c7cdd8; word-break: keep-all; flex: 1; }
    .meta { display: flex; flex-wrap: wrap; gap: 6px; }
    .tag {
      font-size: 12px;
      padding: 2px 8px;
      border-radius: 999px;
      background: var(--panel-2);
      border: 1px solid var(--line);
      color: var(--muted);
    }
    .play {
      margin-top: 4px;
      text-align: center;
      font-weight: 700;
      padding: 11px;
      border-radius: 10px;
      background: var(--accent);
      color: #fff;
    }
    footer { margin-top: 32px; text-align: center; color: var(--muted); font-size: 12px; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="kicker">GAME LOUNGE</div>
      <h1>"딱!한판더" 게임 라운지</h1>
      <p>함께할 게임을 골라 주세요</p>
    </header>

    <main class="grid" id="games"></main>

    <footer>scleewow.github.io</footer>
  </div>

  <script>
    // 게임을 추가하려면 이 목록에 한 줄만 추가하면 됩니다.
    const GAMES = [
      {
        path: 'minus/',
        icon: '➖',
        title: '마이너스 경매',
        sub: 'THE GENIUS',
        desc: '숫자 카드를 받거나 칩으로 거부하며, 마이너스 점수를 가장 적게 받는 사람이 이기는 경매 게임',
        tags: ['2명 이상 7명이하(적정6명)', '방 번호 · QR 입장'],
        accent: '#d12a4a',
      },
      {
        path: 'mafia/',
        icon: '🧟',
        title: '언데드 마피아',
        sub: 'UNDEAD MAFIA',
        desc: '정체를 숨긴 언데드를 찾아내는 마피아 추리 게임',
        tags: ['적정 15명', '단체', '방 번호 입장'],
        accent: '#9333ea',
      },
      {
        path: 'avalon/',
        icon: '🛡️',
        title: '아발론',
        sub: 'AVALON',
        desc: '선과 악으로 나뉘어 원정을 성공시키거나 방해하는 정체 숨김 심리전 게임',
        tags: ['단체', '심리전'],
        accent: '#2563eb',
      },
      {
        path: 'fruit/',
        icon: '🍎',
        title: '과일가게',
        sub: 'THE GENIUS',
        desc: '내 과일 두 개의 판매가를 몰래 정해 가장 싸게 부른 사람만 파는 4라운드 심리전. 담합할지, 배신할지, 같이 망하게 할지 협상으로 결정하는 다인원 게임',
        tags: ['4~15명(적정13명)', '협상', '심리전'],
        accent: '#e11d48',
      },      
      {
        path: 'loyal/',
        icon: '👑',
        title: '충신과 역적',
        sub: 'THE GENIUS',
        desc: '충신은 숫자가 1000을 넘지 않게, 숨은 역적은 1000을 넘기게. 왕을 뽑아 의심 가는 사람을 감옥에 보내는 정체 숨김 심리전',
        tags: ['7~12명(적정9명)', '정체 숨김', '방 번호 · QR 입장'],
        accent: '#a9412c',
      },
      {
        path: 'chess/',
        icon: '🏯',
        title: '십이장기',
        sub: 'THE GENIUS',
        desc: '3×4 판 위에서 왕·장·상·자를 움직여 상대 왕을 잡거나, 내 왕을 상대 진영 끝까지 보내 버티면 이기는 2인 전략 게임',
        tags: ['2명', '전략'],
        accent: '#16a34a',
      },
      {
        path: 'lier/',
        icon: '🤥',
        title: '라이어 게임',
        sub: 'LIAR GAME',
        desc: '폰 한 대를 돌려 제시어를 몰래 확인하고, 제시어를 모르는 라이어를 찾아내는 파티 게임. 기본·바보·스파이 3가지 모드',
        tags: ['3~12명', '폰 한 대', '모여서 대면'],
        accent: '#f59e0b',
      },
    ];

    const esc = (s) => String(s).replace(/[&<>"']/g, (c) => (
      { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

    document.getElementById('games').innerHTML = GAMES.map((g) => `
      <a class="card" href="${esc(g.path)}" style="--accent:${esc(g.accent)}">
        <div class="card-top">
          <div class="icon">${g.icon}</div>
          <div>
            <h2>${esc(g.title)}</h2>
            <div class="sub">${esc(g.sub)}</div>
          </div>
        </div>
        <p class="desc">${esc(g.desc)}</p>
        <div class="meta">${g.tags.map((t) => `<span class="tag">${esc(t)}</span>`).join('')}</div>
        <div class="play">플레이</div>
      </a>`).join('');
  </script>
</body>
</html>
