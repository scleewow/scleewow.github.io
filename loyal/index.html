<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0d12" />
  <title>충신과 역적</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@700&display=swap" rel="stylesheet" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23a9412c'/%3E%3Cpath d='M6 22h20l-2.5-11-6 4.5L16 9l-1.5 6.5-6-4.5z' fill='white'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="style.css?v=20261111d" />
  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
</head>
<body>
  <main id="app" class="app">
    <div class="loading">불러오는 중…</div>
  </main>
  <div id="sheet" class="sheet-root"></div>
  <div id="chatSheet" class="sheet-root chat-root" hidden>
    <div class="sheet-backdrop" data-close-chat></div>
    <section class="sheet chat-sheet" role="dialog" aria-label="메모">
      <div class="sheet-head">
        <div>
          <h2>메모</h2>
          <p class="sub" id="chatSub"></p>
        </div>
        <button class="icon-btn" data-close-chat aria-label="닫기">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <div id="chatBody" class="chat-body"></div>
    </section>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script>
    function lrShowLoadError(msg) {
      document.getElementById('app').innerHTML = '<div class="config-error">' + msg + '</div>';
    }
    if (location.protocol === 'file:') {
      lrShowLoadError('파일을 직접 열면 실행되지 않아요.<br/>GitHub Pages에 올리거나 로컬 서버로 열어 주세요.');
    } else {
      setTimeout(function () {
        if (document.querySelector('#app .loading')) {
          lrShowLoadError('화면을 불러오지 못했어요.<br/>F12 &gt; Console 탭의 빨간 오류 메시지를 확인해 주세요.');
        }
      }, 8000);
    }
  </script>
  <script type="module" src="app.js?v=20261111d"></script>
</body>
</html>
