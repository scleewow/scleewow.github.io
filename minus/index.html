<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0d12" />
  <title>마이너스 경매</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Oswald:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
</head>
<body>
  <main id="app" class="app">
    <div class="loading">불러오는 중…</div>
  </main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script>
    function maShowLoadError(msg) {
      document.getElementById('app').innerHTML = '<div class="config-error">' + msg + '</div>';
    }
    if (location.protocol === 'file:') {
      maShowLoadError('파일을 직접 열면 실행되지 않아요.<br/>GitHub Pages에 올리거나 로컬 서버로 열어 주세요.');
    } else {
      setTimeout(function () {
        if (document.querySelector('#app .loading')) {
          maShowLoadError('화면을 불러오지 못했어요.<br/>F12 &gt; Console 탭의 빨간 오류 메시지를 확인해 주세요.');
        }
      }, 8000);
    }
  </script>
  <script type="module" src="app.js"></script>
</body>
</html>
